[project]
name = "task-lms-platform"
version = "0.1.0"
description = ""
authors = [
    { name = "Natalia Kirpichnikova" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "djangorestframework (>=3.18.1,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
]

[black]
line-length = 119
exclude = '\.git'

[isort]
line_length = 119
force_single_line = true
