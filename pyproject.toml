[project]
name = "task-lms-platform"
version = "0.1.0"
description = ""
authors = [
    { name = "Natalia Kirpichnikova" }
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=5.2.0,<6.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "djangorestframework (>=3.18.1,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "django-phonenumber-field[phonenumbers] (>=8.5.0,<9.0.0)",
    "django-filter (>=26.1,<27.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "coverage (>=7.16.2,<8.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "stripe (>=16.0.0,<17.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
]

[black]
line-length = 119
exclude = '\.git'

[isort]
line_length = 119
force_single_line = true
