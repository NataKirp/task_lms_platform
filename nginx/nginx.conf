events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 20M;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 30d;
            access_log off;
        }

        location / {
            proxy_pass http://django;
        }
    }
}